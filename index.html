<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="author" content="Maxwell Anavian">
  <meta name="description" content="Maxwell Anavian: software developer at National Grid and photographer.">
  <title>Max Anavian</title>
  <link rel="preload" href="photos/photo_01.jpg" as="image">
  <link rel="preload" href="https://unpkg.com/98.css@0.1.21/fonts/converted/ms_sans_serif.woff2" as="font" type="font/woff2" crossorigin>
  <link href="assets/desktop.css?v=15" rel="stylesheet">
</head>
<body>
  <main id="desktop" aria-label="Desktop">
    <ul class="icons" id="icons" aria-label="Desktop icons"></ul>
    <div id="windows"></div>
  </main>

  <nav class="taskbar" aria-label="Taskbar">
    <button class="start bevel" id="startBtn" aria-haspopup="menu" aria-expanded="false">
      <span class="start-logo" aria-hidden="true"></span>Start
    </button>
    <div class="tasks" id="tasks"></div>
    <div class="tray bevel-in">
      <a href="https://github.com/anavianm" target="_blank" rel="noopener" aria-label="GitHub" class="tray-icon" data-icon="github"></a>
      <a href="https://www.linkedin.com/in/maxwell-anavian/" target="_blank" rel="noopener" aria-label="LinkedIn" class="tray-icon" data-icon="linkedin"></a>
      <time id="clock"></time>
    </div>
  </nav>

  <div class="start-menu bevel" id="startMenu" role="menu" hidden>
    <ul id="startList"></ul>
  </div>

  <div class="shutdown" id="shutdown" hidden>
    <p>It's now safe to turn off<br>your computer.</p>
    <button class="bevel" id="rebootBtn">Restart</button>
  </div>

  <script src="assets/desktop.js?v=15"></script>
</body>
</html>
